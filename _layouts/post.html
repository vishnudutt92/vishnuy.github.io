---
layout: default
---
<article>
  <div class="post-header">
    <div class="meta">{{ page.date | date: "%d %b %Y" }}{% if page.tags %} — filed under {{ page.tags | join: ", " }}{% endif %}</div>
    <h1>{{ page.title }}</h1>
  </div>
  <div class="post-body">
    {{ content }}
  </div>
  <p style="margin-top:3rem;"><a href="{{ '/blog/' | relative_url }}">&larr; Back to the log</a></p>
</article>
